# The project uses ECC-signed user tokens. Validate them with auth.getUser in
# the function; the gateway legacy-secret check rejects these valid tokens.
[functions.aws-face-verification]
verify_jwt = false

# User tokens are signed with the project's ECC key, which the gateway's legacy
# check rejects. The function verifies the caller itself with auth.getUser.
[functions.apple-revoke]
verify_jwt = false

# Called by pg_cron only, with the X-Retention-Secret header.
[functions.retention-purge]
verify_jwt = false

# Called by the app with the user's ECC-signed token; checked with auth.getUser.
[functions.store-entitlement]
verify_jwt = false

# Called by the app with the user's ECC-signed token; checked with auth.getUser.
[functions.app-attest]
verify_jwt = false
